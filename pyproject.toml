[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "di-curve-analytics"
version = "0.2.0"
description = "Curva DI, risco de taxa, cenários e ALM com dados públicos da B3, BCB e ANBIMA."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "LuigiBerzaghi" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.scripts]
dicurve-atualizar = "dicurve.ingest.atualizar:main"
dicurve-backfill = "dicurve.ingest.backfill:main"

[project.optional-dependencies]
data = [
    "pyield",
    "bizdays",
    "requests>=2.31",
    "pyarrow>=15",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-requests",
    "pre-commit>=3.7",
    # referências externas usadas nos testes (calendário ANBIMA, flat-forward, forward)
    "bizdays",
    "pyield",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dicurve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: testes que acessam fontes externas (B3, BCB); não rodam na CI por padrão",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "NPY", "PD"]
ignore = [
    "RUF001",  # permite caracteres como "−" e "×" em strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["dicurve"]
