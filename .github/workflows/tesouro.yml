name: Dados do Tesouro

# Baixa a base "Taxas dos Títulos Ofertados pelo Tesouro Direto" (Tesouro Transparente,
# licença ODbL), filtra os prefixados (LTN e NTN-F) e versiona o recorte em data/tesouro/.
on:
  push:
    branches: [fase-3b-tesouro]
    paths: [".github/workflows/tesouro.yml", "scripts/extrair_prefixados.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tesouro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar acesso
        continue-on-error: true
        run: |
          for u in https://www.tesourotransparente.gov.br/ https://www.tesourotransparente.gov.br/ckan/api/3/action/package_show?id=df56aa42-484a-4a59-8184-7676580c81e3 https://www.tesourodireto.com.br/ https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json; do
            echo "== $u"; curl -sS -m 30 -A "Mozilla/5.0" -o /dev/null -w "%{http_code} %{remote_ip}\n" "$u" || true
          done
      - name: Baixar a base do Tesouro Direto
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -A "Mozilla/5.0" -o /tmp/td.csv \
            "https://www.tesourotransparente.gov.br/ckan/dataset/df56aa42-484a-4a59-8184-7676580c81e3/resource/796d2059-14e9-44e3-80c9-2d9e30b405c1/download/precotaxatesourodireto.csv"
          head -c 400 /tmp/td.csv | iconv -f latin1 -t utf-8 || true
      - name: Filtrar prefixados
        run: python scripts/extrair_prefixados.py /tmp/td.csv data/tesouro/prefixados.csv 2020-01-01
      - name: Versionar o recorte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tesouro/prefixados.csv
          if git diff --cached --quiet; then echo "Sem mudanças."; exit 0; fi
          git commit -m "Dados: recorte dos prefixados do Tesouro Direto (ODbL)"
          git push
