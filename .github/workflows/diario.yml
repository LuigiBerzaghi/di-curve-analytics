name: Job diário

# Dados abertos (BCB, licença ODbL): baixa as negociações de LTN e NTN-F no Selic e o CDI,
# roda as verificações, monta os JSON do site e versiona tudo em data/.
# O BCB publica o dia D na manhã de D+1; o job roda duas vezes para não depender do horário.
on:
  schedule:
    - cron: "17 11 * * 1-5"  # 08:17 em Brasília
    - cron: "17 16 * * 1-5"  # 13:17 em Brasília
  workflow_dispatch:
    inputs:
      data:
        description: "Data-base (AAAA-MM-DD). Vazio = dia útil anterior."
        required: false

permissions:
  contents: write

concurrency:
  group: job-diario
  cancel-in-progress: false

jobs:
  diario:
    name: Atualizar, verificar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[data]"

      - name: Atualizar e verificar
        id: atualizar
        run: |
          ARG=""; [ -n "${{ inputs.data }}" ] && ARG="--data ${{ inputs.data }}"
          set +e
          dicurve-atualizar $ARG
          codigo=$?
          set -e
          if [ "$codigo" -eq 3 ]; then
            echo "O BCB ainda não publicou o dia; tenta de novo no próximo horário."
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publicar=sim" >> "$GITHUB_OUTPUT"
          exit "$codigo"

      - name: Montar os JSON do site
        if: steps.atualizar.outputs.publicar == 'sim'
        run: |
          dicurve-publicar --destino data/api
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          latest = json.loads(pathlib.Path("data/api/latest.json").read_text())
          qa = json.loads(pathlib.Path(f"data/api/{latest['data_base']}/qa.json").read_text())
          print(f"### Curva pré {latest['data_base']}: {'aprovada' if qa['aprovado'] else 'reprovada'}\n")
          for v in qa["verificacoes"]:
              print(f"- {'ok' if v['ok'] else v['gravidade']}: {v['regra']} ({v['detalhe']})")
          PY

      - name: Versionar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/abertos data/api
          if git diff --cached --quiet; then echo "Sem mudanças."; exit 0; fi
          git commit -m "Dados: atualização diária (BCB, ODbL)"
          git push
